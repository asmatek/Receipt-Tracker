[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-receipt-processor"
version = "4.0.0"
description = "OCR receipt images and PDFs into validated JSON or CSV"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=10.0.0",
  "pytesseract>=0.3.10",
  "supabase>=2.10,<3",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23.0"]
deskew = ["numpy>=1.24.0", "opencv-python-headless>=4.8.0"]
dev = ["pytest>=7.4.0"]
all = ["PyMuPDF>=1.23.0", "numpy>=1.24.0", "opencv-python-headless>=4.8.0"]

[project.scripts]
receipt-process = "receipt_processor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
